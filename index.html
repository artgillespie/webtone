<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WEBTONE// — FM Groovebox</title>
  <meta name="description" content="A browser FM / wavetable groovebox workstation inspired by the Elektron Digitone II.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" crossorigin="anonymous" href="https://fonts.googleapis.com/css2?family=Michroma&family=Share+Tech+Mono&family=Chakra+Petch:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="src/app/styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231d1a17'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23ff6a1a' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23ffb347'/%3E%3C/svg%3E">
</head>
<body>
  <div id="app" class="chassis" data-testid="app">
    <header id="header" class="header"></header>
    <div class="body">
      <aside id="tracks" class="tracks" aria-label="Tracks" data-testid="tracks"></aside>
      <main class="center">
        <section class="display-row">
          <div class="screen-bezel">
            <canvas id="screen" class="screen" data-testid="screen" aria-label="Display"></canvas>
            <div class="screen-glass"></div>
          </div>
          <div id="encoders" class="encoders" data-testid="encoders" aria-label="Parameter encoders"></div>
        </section>
        <nav id="pages" class="pages" aria-label="Parameter pages" data-testid="pages"></nav>
        <section id="lower" class="lower"></section>
      </main>
    </div>
    <footer id="sequencer" class="sequencer" data-testid="sequencer"></footer>
  </div>
  <div id="overlay-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="boot" class="boot" data-testid="boot">
    <div class="boot-card">
      <div class="boot-logo">WEBTONE<span class="ii">//</span></div>
      <div class="boot-sub">FM · WAVETABLE · SWARM — 16 TRACK GROOVEBOX</div>
      <button id="power" class="power" data-testid="power" aria-label="Power on audio">
        <span class="power-ring"></span><span class="power-label">POWER</span>
      </button>
      <div class="boot-hint">Click to start the audio engine. Press <kbd>?</kbd> for shortcuts.</div>
    </div>
  </div>
  <script type="module" src="src/app/main.js"></script>
</body>
</html>
